# ⚠ `extends:` is a SHALLOW merge of TOP-LEVEL KEYS. Setting a key here
# REPLACES the base's block outright — there is no per-key merge. `platforms:`
# is deliberately NOT restated below: it carries the container legs that make
# this spec's bare Linux keys honest, and restating it to tweak one runner
# would drop them all without reddening anything.
extends: ../mirror-base.yml

name: just

# Logical index package `just/just` at the physical path
# `ghcr.io/ocx-contrib/just/just` — slash segments, never hyphen-flattened.
# Two segments always; `casey` is a personal handle, not a vendor, so the tool
# names itself. The first segment must be this repo's own GitHub owner:
# GITHUB_TOKEN only authorises packages owned by the repo the workflow runs in.
#
# Succeeds the flat `ocx.sh/just` coordinate this repository published before
# the grouped layout.
target:
  registry: ghcr.io
  repository: ocx-contrib/just/just

source:
  type: github_release
  owner: casey
  repo: just
  # just tags are bare semver — no "v" prefix (e.g. "1.51.0").
  tag_pattern: "^(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# Upstream publishes NO `-gnu` Linux asset for amd64 or arm64 — musl target
# triples only. That triple is not the verdict. Byte-measured on 1.57.0:
#
#   $ file just-1.57.0-x86_64-unknown-linux-musl/just
#   ELF 64-bit LSB pie executable, x86-64, static-pie linked, not stripped
#   $ file just-1.57.0-aarch64-unknown-linux-musl/just
#   ELF 64-bit LSB executable, ARM aarch64, statically linked, not stripped
#   $ readelf -l … | grep INTERP  → (none, both arches)
#   $ readelf -d … | grep NEEDED  → (none, both arches)
#
# No PT_INTERP and no DT_NEEDED: musl is linked IN, not linked AGAINST. The
# artifact requires nothing of the host, so both Linux keys are BARE — no
# `+libc.*` suffix. Tagging them `+libc.musl` would be a false requirement that
# hid the package from every glibc host it in fact runs on. Container legs
# (ubuntu + alpine + fedora) live in ../mirror-base.yml and are what turn that
# claim into evidence.
#
# ─── Scope (verified against 1.40.0, the floor, and 1.57.0) ─────────────────
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   arm-unknown-linux-musleabihf       — no OCX linux/arm platform
#   armv7-unknown-linux-musleabihf     — no OCX linux/arm platform
#   loongarch64-unknown-linux-musl     — no OCX platform
#   riscv64gc-unknown-linux-musl       — no OCX platform
#   SHA256SUMS, CHANGELOG.md           — sidecars
#
# The anchored ^…$ regexes are what keep those out. Resolution verified BOTH
# ways: each of the six patterns matches EXACTLY one asset. A pattern matching
# zero is silently skipped, not an error — it would yield a green run with a
# missing platform.
assets:
  linux/amd64:
    - "^just-.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
  linux/arm64:
    - "^just-.*-aarch64-unknown-linux-musl\\.tar\\.gz$"
  darwin/amd64:
    - "^just-.*-x86_64-apple-darwin\\.tar\\.gz$"
  darwin/arm64:
    - "^just-.*-aarch64-apple-darwin\\.tar\\.gz$"
  windows/amd64:
    - "^just-.*-x86_64-pc-windows-msvc\\.zip$"
  windows/arm64:
    - "^just-.*-aarch64-pc-windows-msvc\\.zip$"

# Every archive — tarball and zip alike — is FLAT: just(.exe), the docs and a
# completions/ dir sit at the archive root with no wrapper directory. So
# strip_components 0 on every platform, the binary lands at the content root,
# and one metadata.json (PATH = ${installPath}) serves all six.
asset_type:
  type: archive
  strip_components: 0

# `off`, overriding the base's `auto` — FORCED by the flat archive, not chosen.
# The scan only inspects an interface-visible `${installPath}/<dir>` PATH entry,
# and this archive has no subdirectory to point one at, so both `auto` and
# `verify` fail spec load at exit 65:
#
#   bin_scan is enabled but metadata.json declares no interface-visible
#   ${installPath}/<dir> PATH entry — the verification would inspect no file and
#   pass green whatever the archive contains.
#
# The `binaries` list in metadata.json is therefore hand-maintained, exactly as
# that error directs. It is short and stable: `just` (`just.exe` on Windows) is
# the only mode-0755 entry in the archive; the man page, GRAMMAR.md, README.md
# and completions/ are all 0644 data. Quoted so no YAML 1.1 reader folds the
# bare word into boolean `false`.
bin_scan: "off"

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  min: "1.40.0"
  new_per_run: 5
  poll_interval: "0 */6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: just/tests/smoke.star

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/casey/just/license --jq '.license.spdx_id'
  #   CC0-1.0
  org.opencontainers.image.licenses: "CC0-1.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: just/just
  fork: ocx-contrib/index
